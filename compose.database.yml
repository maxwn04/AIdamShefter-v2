services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: aidam
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aidam"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql/data
