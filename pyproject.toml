[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sleeper-fantasy-reporter"
version = "0.1.0"
description = "AI-powered fantasy football reporter with Sleeper data layer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "python-dotenv",
    "pydantic>=2.0",
    "litellm>=1.40",
    "openai-agents>=0.1.0",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
sleeperdl = "datalayer.cli.main:main"
reporter-v2 = "reporter_v2.app.runner:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["datalayer*", "reporter*", "reporter_memory*"]

[tool.setuptools.package-data]
reporter_v2 = ["procedures/*.md", "prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["datalayer/tests", "reporter_memory/tests", "reporter_v2/tests"]
addopts = "-ra"
pythonpath = ["."]
